# =============================================================================
# Lessonwright Frontend Nginx Configuration
# Serves the React SPA and reverse-proxies /api/ to the FastAPI backend.
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow uploading larger PDF documents to POST /api/ingest
    client_max_body_size 50M;

    # Reverse-proxy API requests to the FastAPI backend container.
    # The trailing slash on both /api/ and http://backend:8000/ strips the /api prefix.
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Critical settings for Server-Sent Events (SSE) on POST /chat ---
        # Disable proxy buffering and caching so tokens stream immediately to
        # the browser instead of arriving all at once when the turn completes.
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Single-Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

